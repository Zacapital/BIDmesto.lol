<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIDmesto.lol — Аукцион мест #1</title>
    
    <!-- Favicon (Иконка в вкладке браузера) -->
    <link rel="icon" type="image/jpeg" href="favion.png.jpg">
    <link rel="apple-touch-icon" href="favion.png.jpg">

    <!-- CSS Стили -->
    <style>
        :root {
            --bg-color: #090a0f;
            --card-bg: #15171e;
            --accent-gold: #FFD700;
            --text-color: #F3F4F6;
            --text-muted: #9CA3AF;
            --border-color: rgba(255, 215, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 30px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            color: var(--accent-gold);
        }

        .btn-bid {
            background: linear-gradient(135deg, #FFF7AD 0%, #FFAA00 50%, #B8860B 100%);
            color: #000;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-bid:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        main {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .hero-title {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #FFF 0%, #FFD700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-rank {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-gold);
            width: 40px;
        }

        .item-info {
            text-align: left;
            flex-grow: 1;
            margin: 0 15px;
        }

        .item-title {
            font-weight: 600;
            color: #fff;
        }

        .item-price {
            font-weight: 700;
            color: var(--accent-gold);
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-container">
            <img src="favion.png.jpg" alt="BIDmesto Logo" class="logo-img">
            <div class="logo-text">BID<span>mesto.lol</span></div>
        </a>
        <a href="https://t.me/your_bot_username" target="_blank" class="btn-bid">Купить место 🚀</a>
    </header>

    <main>
        <h1 class="hero-title">Займите место №1 на главной странице</h1>
        <p class="hero-subtitle">Проект с самой высокой ставкой находится на вершине!</p>

        <div class="leaderboard">
            <div class="item-card">
                <div class="item-rank">#1</div>
                <div class="item-info">
                    <div class="item-title">Здесь может быть ваш проект</div>
                </div>
                <div class="item-price">100 $</div>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 BIDmesto.lol — Все права защищены.
    </footer>

</body>
</html>
