<html lang="ru">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIDmesto.lol — Рейтинг за деньги</title>
<style>
  :root{
    --bg:#081712;
    --bg-2:#0c2119;
    --card:#0f251c;
    --border:#1e4536;
    --primary:#1f8f5f;
    --primary-light:#2bb37a;
    --gold:#d4af37;
    --text:#f3f1ea;
    --muted:#9db3aa;
    --muted-2:#6f8579;
    --danger:#e5484d;
  }

  /* Yorug' rejim */
  body.light{
    --bg:#f4f7f5;
    --bg-2:#e8f0eb;
    --card:#ffffff;
    --border:#c5d9cc;
    --primary:#1f8f5f;
    --primary-light:#2bb37a;
    --gold:#b8860b;
    --text:#0d1f17;
    --muted:#4a6357;
    --muted-2:#6b7f74;
    --danger:#e5484d;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
    color:var(--text);
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition: background 0.3s, color 0.3s;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px 60px;}

  .ribbon{
    background:var(--card);border:1px solid var(--border);color:var(--muted);
    font-size:13px;padding:9px 14px;border-radius:10px;text-align:center;margin-bottom:20px;
  }
  .ribbon b{color:var(--gold);}

  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:26px;}
  .logo{font-weight:800;font-size:26px;letter-spacing:-0.5px;}
  .logo span{color:var(--primary-light);}
  nav{display:flex;gap:18px;font-size:14px;color:var(--muted);}
  nav a{cursor:pointer;}
  nav a:hover{color:var(--primary-light);}
  
  .header-right{display:flex;align-items:center;gap:12px;}
  
  .theme-btn{
    background:var(--card);border:1px solid var(--border);color:var(--text);
    width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;
  }
  .theme-btn:hover{border-color:var(--primary-light);}

  .live{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--primary-light);
    background:var(--card);padding:6px 12px;border-radius:999px;border:1px solid var(--border);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--primary-light);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  .hero{text-align:center;margin-bottom:26px;}
  .hero h1{font-size:32px;font-weight:800;margin:0 0 10px;line-height:1.25;}
  .hero h1 b{color:var(--gold);}
  .hero p{color:var(--muted);font-size:14.5px;max-width:520px;margin:0 auto;line-height:1.55;}

  .form-card{
    background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:20px;margin:22px 0 26px;display:flex;flex-direction:column;gap:12px;
